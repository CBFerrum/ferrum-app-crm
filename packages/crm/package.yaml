package: crm
version: 0.4.0
label: CRM
description: Leads, opportunities and the sales pipeline, prospects, contacts and addresses, campaigns, activities and quotations.
# Contacts, customers and items are shared with other apps; ERP's sales orders and taxes come with
# the crm_erp connector (docs: plan/apps-ui.md §13 in the platform).
depends: [core, contacts, parties, products]
field_prefix: crm_

overlays:
  # A contact's and an address's lead (and a contact's prospect); a contact's consent to calls and
  # e-mail (Unsubscribed is the e-mail side), and their move to another company.
  - entity: Contact
    ops:
      - {op: add_field, column: true, after: supplier, field: {name: lead, type: link, to: Lead, in_filter: true}}
      - {op: add_field, column: true, after: lead, field: {name: prospect, type: link, to: Prospect, in_filter: true}}
      - {op: add_field, column: true, after: unsubscribed, field: {name: do_not_call, type: check, in_filter: true, label: Do Not Call, description: "No sales calls: a call logged to them needs a reason"}}
      - {op: add_field, column: true, after: do_not_call, field: {name: call_consent_on, type: date, label: Calls Since, description: "Since when calls are allowed or refused; set when it changes"}}
      - {op: add_field, column: true, after: call_consent_on, field: {name: call_consent_how, type: data, description: "A web form, in person, a phone call, a request by mail or letter…", label: Calls Given or Withdrawn By}}
      - {op: add_field, column: true, after: call_consent_how, field: {name: email_consent_on, type: date, label: Email Since, description: "Since when marketing email is allowed or refused; set when it changes"}}
      - {op: add_field, column: true, after: email_consent_on, field: {name: email_consent_how, type: data, description: "A web form, in person, a phone call, a request by mail or letter…", label: Email Given or Withdrawn By}}
      - op: add_action
        action:
          name: move_to_account
          label: Moved to Another Company
          permission: write
          params:
            - {name: customer, type: link, to: Customer, label: New Customer, description: "Or a prospect"}
            - {name: prospect, type: link, to: Prospect, label: New Prospect}
            - {name: title, type: data, label: Title or Role There}
            - {name: on, type: date, label: Since, description: "Today when empty: the day they left their company and started at the new one"}
  # An account's owner, territory and parent (who may read a customer stays as it was).
  - entity: Customer
    ops:
      - {op: add_field, column: true, after: customer_group, field: {name: account_owner, type: email, in_filter: true, label: Account Owner, description: "A user's email: who looks after the account in sales"}}
      - {op: add_field, column: true, after: account_owner, field: {name: territory, type: link, to: Territory, in_filter: true}}
      - {op: add_field, column: true, after: territory, field: {name: parent_customer, type: link, to: Customer, in_filter: true, label: Parent Account, description: "The group or head office it belongs to"}}
  - entity: Address
    ops:
      - {op: add_field, column: true, after: supplier, field: {name: lead, type: link, to: Lead, in_filter: true}}
      - {op: add_rule, rule: {name: linked, check: "doc.customer != null || doc.supplier != null || doc.lead != null", message: "Link the address to a customer, supplier or lead"}}

modules:
  - name: crm
    label: CRM
    icon: handshake
    order: 35
    items: [Lead, Opportunity, Quotation, Activity, Prospect, Contact, AccountContact, Address, Customer, Item, Campaign, SalesPipeline, SalesStage, BuyingRole, Territory, SalesTeam,
            SalesTarget, LostReason, QuotationApprovalRule, ProductRule, LeadAssignmentRule, LeadScoringRule, CrmSettings, report:sales_pipeline, report:sales_forecast, report:sales_targets, report:lead_funnel, report:campaign_performance,
            report:campaign_attribution, report:quotation_register, report:win_rate, report:sales_cycle, report:lost_reasons, report:activity_by_person]

roles:
  - name: Sales User
    description: "Works the leads, opportunities and activities they own, and their quotations; a team's manager works its team's too, and a territory's sales people the leads and deals in it."
    permissions:
      - {entity: Lead, read: true, write: true, create: true, delete: true, export: true, if_owner: true}
      - {entity: Opportunity, read: true, write: true, create: true, delete: true, export: true, if_owner: true}
      - {entity: Activity, read: true, write: true, create: true, delete: true, if_owner: true}
      - {entity: Quotation, read: true, write: true, create: true, delete: true, submit: true, cancel: true, if_owner: true}
      # A sales team's manager: its people's records (each record is its owner's team's unless another is chosen).
      - {entity: Lead, read: true, write: true, export: true, via: sales_team.manager}
      - {entity: Opportunity, read: true, write: true, export: true, via: sales_team.manager}
      - {entity: Activity, read: true, write: true, via: sales_team.manager}
      - {entity: Quotation, read: true, write: true, submit: true, cancel: true, via: sales_team.manager}
      # A territory's sales people: the leads and deals in it and in the territories under it.
      - {entity: Lead, read: true, write: true, via: territory.reach.person}
      - {entity: Opportunity, read: true, write: true, via: territory.reach.person}
      # Their own targets, and their teams'.
      - {entity: SalesTarget, read: true, if_owner: true}
      - {entity: SalesTarget, read: true, via: sales_team.manager}
      - {entity: SalesTarget, read: true, via: sales_team.members.person}
      - {entity: SalesTeam, read: true}
      - {entity: AccountContact, read: true, write: true, create: true}
      - {entity: LeadScoringRule, read: true}
      - {entity: Prospect, read: true, write: true, create: true}
      - {entity: Contact, read: true, write: true, create: true}
      - {entity: Address, read: true, write: true, create: true}
      # As ERP's selling gives them: converting a lead makes or picks a customer, with or without ERP.
      - {entity: Customer, read: true, write: true, create: true}
      - {entity: CustomerGroup, read: true}
      - {entity: Campaign, read: true}
      - {entity: ProductRule, read: true}
      - {entity: SalesPipeline, read: true}
      - {entity: SalesStage, read: true}
      - {entity: BuyingRole, read: true}
      - {entity: PriceList, read: true}
      - {entity: ItemPrice, read: true}
      - {entity: Territory, read: true}
      - {entity: LostReason, read: true}
  - name: Sales Manager
    description: The whole team's CRM records, pipeline and quotations.
    permissions:
      - {entity: Lead, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Opportunity, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Activity, read: true, write: true, create: true, delete: true, export: true}
      - {entity: Quotation, read: true, write: true, create: true, delete: true, submit: true, cancel: true, export: true}
      - {entity: Prospect, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Contact, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Address, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Campaign, read: true, write: true, create: true, delete: true, export: true}
      - {entity: SalesPipeline, read: true, write: true, create: true, delete: true}
      - {entity: SalesStage, read: true, write: true, create: true, delete: true}
      - {entity: BuyingRole, read: true, write: true, create: true, delete: true}
      - {entity: QuotationApprovalRule, read: true, write: true, create: true, delete: true}
      - {entity: ProductRule, read: true, write: true, create: true, delete: true}
      - {entity: Territory, read: true, write: true, create: true, delete: true}
      - {entity: LostReason, read: true, write: true, create: true, delete: true}
      - {entity: LeadAssignmentRule, read: true, write: true, create: true, delete: true}
      - {entity: SalesTeam, read: true, write: true, create: true, delete: true}
      - {entity: SalesTarget, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: LeadScoringRule, read: true, write: true, create: true, delete: true}
      - {entity: AccountContact, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: CrmSettings, read: true, write: true, create: true}
      - {entity: Customer, read: true, write: true, create: true, export: true}
      - {entity: CustomerGroup, read: true}
      - {entity: Item, read: true}
      - {entity: ItemGroup, read: true}
      - {entity: ItemPrice, read: true}
      - {entity: PriceList, read: true}
      - {entity: Warehouse, read: true}
      - {entity: Company, read: true}
      - {entity: Currency, read: true}
      - {entity: Uom, read: true}
      - {entity: TaxTemplate, read: true}
  - name: Marketing Manager
    description: Campaigns and lead generation.
    permissions:
      - {entity: Campaign, read: true, write: true, create: true, delete: true, export: true}
      - {entity: Lead, read: true, write: true, create: true, delete: true, export: true, import: true}
      - {entity: Prospect, read: true, write: true, create: true, export: true, import: true}
      - {entity: Contact, read: true, write: true, create: true, export: true, import: true}
      - {entity: Address, read: true, write: true, create: true}
      - {entity: Activity, read: true, write: true, create: true}
      - {entity: Opportunity, read: true}
      - {entity: SalesPipeline, read: true}
      - {entity: SalesStage, read: true}
      - {entity: Territory, read: true, write: true, create: true}
      - {entity: LostReason, read: true}
      - {entity: LeadAssignmentRule, read: true}
      - {entity: LeadScoringRule, read: true, write: true, create: true, delete: true}
      - {entity: AccountContact, read: true}
      - {entity: Company, read: true}
      - {entity: Currency, read: true}
  - name: CRM Viewer
    description: Read-only access to CRM records and reports.
    permissions:
      - {entity: Lead, read: true}
      - {entity: Opportunity, read: true}
      - {entity: Activity, read: true}
      - {entity: Quotation, read: true}
      - {entity: Prospect, read: true}
      - {entity: Contact, read: true}
      - {entity: Address, read: true}
      - {entity: Campaign, read: true}
      - {entity: SalesPipeline, read: true}
      - {entity: SalesStage, read: true}
      - {entity: BuyingRole, read: true}
      - {entity: Territory, read: true}
      - {entity: LostReason, read: true}
      - {entity: AccountContact, read: true}
      - {entity: SalesTeam, read: true}
      - {entity: SalesTarget, read: true}

# What a personal-data request exports and erases for a person (their email).
personal_data:
  # A person's do-not-call and unsubscribe stay, so that they are not called or mailed again; when
  # and how they were given or withdrawn go.
  - {entity: Lead, match: email, phone: phone, name: lead_name,
     erase: [first_name, last_name, lead_name, organization_name, job_title, email, phone, mobile, phone_key, mobile_key, address_line1, address_line2, postal_code, need, notes,
             score_why, call_consent_on, call_consent_how, email_consent_on, email_consent_how]}
  # A contact's (fields CRM adds to the platform's Contact): src/consent.rs `ConsentHeld`.
  # Where the person worked and as what.
  - {entity: AccountContact, match: contact, erase: [title]}
  # An organization's own email and phone can be a person's (a sole trader's); its name stays, as a company customer's does.
  - {entity: Prospect, match: email, phone: phone, erase: [email, phone, notes]}
  # What was written down about the person on their lead or contact: calls, meetings and notes.
  - {entity: Activity, match: lead, erase: [subject, details, call_reason]}
  - {entity: Activity, match: contact, erase: [subject, details, call_reason]}
seed:
  # One pipeline (sql/004_pipelines.sql gives a workspace already there the same one, holding its stages).
  - entity: SalesPipeline
    key: [pipeline_name]
    records:
      - {pipeline_name: Sales Pipeline, is_default: true}
  - entity: SalesStage
    key: [pipeline, stage_name]
    records:
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Prospecting, probability: 10, stage_order: 1}
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Qualification, probability: 20, stage_order: 2}
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Needs Analysis, probability: 40, stage_order: 3}
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Proposal, probability: 60, stage_order: 4, forecast_category: Best Case}
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Negotiation, probability: 80, stage_order: 5, forecast_category: Commit}
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Won, probability: 100, stage_order: 6, outcome: Won}
      - {pipeline: "@SalesPipeline:pipeline_name=Sales Pipeline", stage_name: Lost, probability: 0, stage_order: 7, outcome: Lost}
  - entity: BuyingRole
    key: [role_name]
    records:
      - {role_name: Decision Maker}
      - {role_name: Influencer}
      - {role_name: User}
      - {role_name: Finance}
      - {role_name: Legal}
  - entity: LostReason
    key: [reason]
    records:
      - {reason: Price}
      - {reason: Lost to Competitor}
      - {reason: No Budget}
      - {reason: No Decision}
      - {reason: Timing}
      - {reason: Requirements Not Met}
      - {reason: Not Interested}
      - {reason: Unresponsive}
      - {reason: Other}
  - entity: Territory
    key: [territory_name]
    records:
      - {territory_name: All Territories, is_group: true}
handover:
  - {entity: Lead, field: assigned_to, where: {status: [New, Contacted, Qualified]}}
  - {entity: Opportunity, field: assigned_to, where: {status: Open}}
  - {entity: Activity, field: assigned_to, where: {status: Open}}
  - {entity: Quotation, field: assigned_to, where: {status: [Draft, Open]}}
  - {entity: Prospect, field: assigned_to}
  # A customer's account owner moves too: src/accounts.rs `Departures` (a package cannot declare a
  # field it adds to another's entity here).
