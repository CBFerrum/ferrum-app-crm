- name: QuotationItem
  label: Quotation Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: description, type: text}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, min: "0.000000001", in_list: true}
    - {name: conversion_factor, type: decimal, read_only: true, label: Stock Units per Unit}
    - {name: stock_qty, type: decimal, read_only: true, label: Qty in Stock Unit}
    - {name: stock_uom, type: link, to: Uom, fetch_from: item.stock_uom, read_only: true, label: Stock Unit}
    - {name: price_basis, type: data, hidden: true, no_copy: true, description: "What the price was set for: item, unit, factor and price"}
    - {name: price_list_rate, type: currency, read_only: true, currency: parent.currency}
    - {name: discount_percent, type: percent, min: "0", max: "100"}
    - {name: rate, type: currency, read_only: true, currency: parent.currency, in_list: true}
    - {name: amount, type: currency, read_only: true, currency: parent.currency, in_list: true}
    - {name: net_amount, type: currency, read_only: true, currency: parent.currency}
    - {name: ordered_qty, type: decimal, read_only: true, no_copy: true, in_list: true}
    - {name: item_tax_rates, type: json, read_only: true}

- name: Quotation
  label: Quotation
  kind: document
  module: crm
  submittable: true
  company_scoped: true
  title_field: party_name
  numbering: {template: "QTN-{FY}-{seq:5}", date_field: posting_date}
  owner_fields: [assigned_to]
  fields:
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: party_type, type: select, options: [Customer, Lead, Prospect], required: true, default: Customer, label: Quotation To, in_filter: true}
    - {name: customer, type: link, to: Customer, required_if: "doc.party_type == 'Customer'", in_filter: true, description: "For a lead or a prospect: set once it becomes a customer"}
    - {name: lead, type: link, to: Lead, visible_if: "doc.party_type == 'Lead'", required_if: "doc.party_type == 'Lead'", in_filter: true}
    - {name: prospect, type: link, to: Prospect, visible_if: "doc.party_type == 'Prospect'", required_if: "doc.party_type == 'Prospect'", in_filter: true}
    - {name: party_name, type: data, read_only: true, in_list: true}
    - {name: contact, type: link, to: Contact}
    - {name: opportunity, type: link, to: Opportunity, in_filter: true}
    - {name: posting_date, type: date, required: true, default_expr: today, label: Quotation Date, in_list: true, in_filter: true}
    - {name: valid_till, type: date, in_list: true, in_filter: true, description: Defaults to 30 days after the quotation date}
    - {name: currency, type: link, to: Currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001"}
    - {name: price_list, type: link, to: PriceList}
    - {name: items, type: table, of: QuotationItem}
    - {name: discount_percent, type: percent, min: "0", max: "100", label: Additional Discount %}
    - {name: total, type: currency, currency: currency, read_only: true}
    - {name: discount_amount, type: currency, currency: currency, read_only: true}
    - {name: net_total, type: currency, currency: currency, read_only: true}
    - {name: total_taxes, type: currency, currency: currency, read_only: true}
    - {name: grand_total, type: currency, currency: currency, read_only: true, in_list: true}
    - {name: rounding_adjustment, type: currency, currency: currency, read_only: true}
    - {name: rounded_total, type: currency, currency: currency, read_only: true}
    - {name: base_net_total, type: currency, read_only: true}
    - {name: base_grand_total, type: currency, read_only: true}
    - {name: base_rounded_total, type: currency, read_only: true}
    - {name: per_ordered, type: percent, read_only: true, no_copy: true}
    - {name: status, type: select, options: [Draft, Open, Sent, Viewed, Accepted, Rejected, Partially Ordered, Ordered, Lost, Expired, Cancelled], default: Draft, read_only: true, no_copy: true, in_list: true, in_filter: true, description: "Ordered once ERP makes sales orders from it: a submitted quotation offers Create Sales Order where ERP and the CRM and ERP connector are installed"}
    - {name: lost_reason, type: link, to: LostReason, read_only: true, no_copy: true}
    - {name: lost_detail, type: text, read_only: true, no_copy: true}
    - {name: revision, type: int, read_only: true, no_copy: true, in_list: true, description: "1, then one more each time it is cancelled and amended"}
    - {name: revision_of, type: link, to: Quotation, read_only: true, no_copy: true, on_delete: set_null, label: Revises, description: The quotation this revision replaces}
    - {name: replaced_by, type: link, to: Quotation, read_only: true, no_copy: true, on_delete: set_null, in_filter: true, label: Replaced By, description: Its next revision}
    - {name: sent_on, type: date, read_only: true, no_copy: true, description: "When it was marked sent to the customer"}
    - {name: sent_at, type: datetime, read_only: true, no_copy: true, description: "The moment it was sent (Sent On is its day)"}
    - {name: answered_at, type: datetime, read_only: true, no_copy: true, description: "The moment of the customer's answer (Answered On is its day)"}
    - {name: viewed_at, type: datetime, read_only: true, no_copy: true, description: "When the customer first opened what was sent (the platform says so when they first act on their link's page); empty until they do, and again after it is sent anew"}
    - {name: answer, type: select, options: [Accepted, Rejected], read_only: true, no_copy: true, in_filter: true, label: Customer's Answer}
    - {name: answered_on, type: date, read_only: true, no_copy: true}
    - {name: answered_by, type: email, read_only: true, no_copy: true, description: Who recorded the customer's answer; empty when the customer answered by their link}
    - {name: answer_name, type: data, read_only: true, no_copy: true, label: Name the Customer Typed, description: "The name typed when the customer answered by their link"}
    - {name: answer_reason, type: link, to: LostReason, read_only: true, no_copy: true, label: Reason Rejected}
    - {name: answer_detail, type: text, read_only: true, no_copy: true, label: Rejection Detail}
    - {name: campaign, type: link, to: Campaign, in_filter: true}
    - {name: assigned_to, type: email, default_expr: "user.email", label: Quotation Owner, in_list: true, in_filter: true, description: "A user's email; the owner can see and edit the quotation"}
    - {name: sales_team, type: link, to: SalesTeam, in_filter: true, description: "Empty: its owner's first team. Its manager sees and works it"}
    - {name: terms, type: text}
    - {name: needs_approval, type: check, read_only: true, no_copy: true, in_filter: true}
    - {name: rule_issues, type: text, read_only: true, no_copy: true, visible_if: "doc.rule_issues != null && doc.rule_issues != ''", label: Product Rules Broken, description: What the lines break of the product rules; it is not submitted until none are}
    - {name: approved_by, type: email, read_only: true, no_copy: true}
    - {name: approved_at, type: datetime, read_only: true, no_copy: true}
    - {name: approved_total, type: currency, read_only: true, no_copy: true, hidden: true}
    - {name: approved_discount, type: percent, read_only: true, no_copy: true, hidden: true}
    - {name: approved_digest, type: data, read_only: true, no_copy: true, label: Approved As,
       description: "What was approved: the party, each line as quoted, the additional discount, taxes, currency, terms and validity. Any of them changed, it is approved again"}
  form:
    - {label: Quotation, fields: [company, party_type, customer, lead, prospect, party_name, contact, opportunity, posting_date, valid_till, assigned_to, sales_team]}
    - {label: Currency and Price List, collapsible: true, fields: [currency, conversion_rate, price_list]}
    - {label: Items, fields: [items]}
    - {label: Taxes, fields: [tax_template, taxes, discount_percent]}
    - {label: Totals, fields: [total, discount_amount, net_total, total_taxes, grand_total, rounding_adjustment, rounded_total, per_ordered, status]}
    - {label: Customer's Answer, collapsible: true, fields: [revision, revision_of, replaced_by, sent_on, sent_at, viewed_at, answer, answered_on, answered_at, answered_by, answer_name, answer_reason, answer_detail]}
    - {label: More, collapsible: true, fields: [base_net_total, base_grand_total, base_rounded_total, lost_reason, lost_detail, campaign, terms]}
  rules:
    - {name: validity_after_date, check: "doc.valid_till == null || doc.valid_till >= doc.posting_date", message: "Valid till cannot be before the quotation date"}
    - {name: has_items, check: "size(doc.items) > 0", message: "Add at least one item", on: submit}
  actions:
    - {name: approve_quotation, label: Approve, docstatus: [0], permission: write, condition: "doc.needs_approval && doc.approved_by == null"}
    - {name: add_rule_needs, label: Add What the Rules Need, docstatus: [0], permission: write, condition: "doc.rule_issues != null && doc.rule_issues != ''"}
    - {name: mark_sent, label: Mark as Sent, docstatus: [1], permission: submit, condition: "doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed'"}
    - {name: mark_accepted, label: Accepted, docstatus: [1], permission: submit, condition: "doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed'", confirm: "Record that the customer accepted this quotation?"}
    # Sending: one press makes the document, the signed link and the message from the package's templates (a workspace
    # edits them under Settings), and records it as sent. The customer's link runs the three actions below it.
    - name: send_quotation
      label: Send to Customer
      docstatus: [1]
      permission: submit
      condition: "doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed'"
      confirm: "Send this quotation to the customer, with a link on which they can read and answer it? Links sent before stop working."
      params:
        - {name: to, type: email, label: Send To, description: "Empty: the quotation's contact, else its lead's, prospect's or customer's address"}
      refuse_if:
        - {when: "isEmpty(coalesce(has(params.to) ? params.to : null, links.contact != null ? links.contact.email : null, links.lead != null ? links.lead.email : null, links.prospect != null ? links.prospect.email : null, links.customer != null ? links.customer.email : null))", message: "There is no address to send it to: choose one, or give the contact or the customer one"}
      effects:
        - {type: invoke, capability: crm.quotation.mark_sent, input: {id: doc.id}, key: "'sent:' + doc.id + ':' + string(now)"}
        - {type: generate, template: crm.quotation_document, name: "'Quotation ' + doc.number", replace: true}
        - type: link
          when: "settings.CrmSettings.quote_link_shows == 'Lines and Totals'"
          actions: [customer_accept, customer_decline, customer_ask]
          show: [party_name, posting_date, valid_till, items, total, discount_amount, total_taxes, grand_total, terms]
          columns: {items: [item_name, qty, rate, amount]}
          until: doc.valid_till
          uses: 20
          recipient: doc.party_name
          code_to: "settings.CrmSettings.quote_link_code ? coalesce(has(params.to) ? params.to : null, links.contact != null ? links.contact.email : null, links.lead != null ? links.lead.email : null, links.prospect != null ? links.prospect.email : null, links.customer != null ? links.customer.email : null) : null"
        - type: link
          when: "settings.CrmSettings.quote_link_shows == 'Totals Only'"
          actions: [customer_accept, customer_decline, customer_ask]
          show: [party_name, posting_date, valid_till, total, discount_amount, total_taxes, grand_total, terms]
          until: doc.valid_till
          uses: 20
          recipient: doc.party_name
          code_to: "settings.CrmSettings.quote_link_code ? coalesce(has(params.to) ? params.to : null, links.contact != null ? links.contact.email : null, links.lead != null ? links.lead.email : null, links.prospect != null ? links.prospect.email : null, links.customer != null ? links.customer.email : null) : null"
        - type: link
          when: "settings.CrmSettings.quote_link_shows == 'Neither'"
          actions: [customer_accept, customer_decline, customer_ask]
          show: [party_name, posting_date, valid_till]
          until: doc.valid_till
          uses: 20
          recipient: doc.party_name
          code_to: "settings.CrmSettings.quote_link_code ? coalesce(has(params.to) ? params.to : null, links.contact != null ? links.contact.email : null, links.lead != null ? links.lead.email : null, links.prospect != null ? links.prospect.email : null, links.customer != null ? links.customer.email : null) : null"
        - type: message
          template: crm.quotation_sent
          to: ["expr:coalesce(has(params.to) ? params.to : null, links.contact != null ? links.contact.email : null, links.lead != null ? links.lead.email : null, links.prospect != null ? links.prospect.email : null, links.customer != null ? links.customer.email : null)"]
          channels: [email]
          attachments: ["results[1]"]
          values: {url: "results[2] != null ? results[2].url : (results[3] != null ? results[3].url : results[4].url)"}
          secret: [url]
    # What the customer does on their link. They are not signed in: each action's conditions and parameters are all they have.
    - name: customer_accept
      label: Accept
      hidden: true
      docstatus: [1]
      permission: read
      condition: "(doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed') && (doc.valid_till == null || doc.valid_till >= today)"
      params:
        - {name: signed_name, type: data, label: Type your full name to accept, required: true}
    - name: customer_decline
      label: Decline
      hidden: true
      docstatus: [1]
      permission: read
      condition: "(doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed') && (doc.valid_till == null || doc.valid_till >= today)"
      params:
        - {name: reason, type: text, label: Why do you decline, required: true}
        - {name: signed_name, type: data, label: Your name}
    - name: customer_ask
      label: Ask a Question
      hidden: true
      docstatus: [1]
      permission: read
      condition: "doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed'"
      params:
        - {name: question, type: text, label: Your question, required: true}
        - {name: signed_name, type: data, label: Your name}
      effects:
        - type: create_document
          entity: Activity
          values:
            activity_type: "'Task'"
            subject: "size(params.question) > 80 ? params.question.substring(0, 80) : params.question"
            details: "concat(params.signed_name, ': ', params.question)"
            assigned_to: doc.assigned_to
            sales_team: doc.sales_team
            opportunity: doc.opportunity
            lead: doc.lead
            customer: doc.customer
            contact: doc.contact
        - {type: message, template: crm.quotation_question, to: [owner], channels: [inapp]}
    - name: mark_rejected
      label: Rejected
      docstatus: [1]
      permission: submit
      condition: "doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed' || doc.status == 'Expired'"
      params:
        - {name: lost_reason, type: link, to: LostReason, label: Reason, required: true}
        - {name: lost_detail, type: text, label: Detail}
    - name: mark_lost
      label: Mark as Lost
      docstatus: [1]
      permission: submit
      condition: "doc.status == 'Open' || doc.status == 'Sent' || doc.status == 'Viewed' || doc.status == 'Accepted' || doc.status == 'Rejected' || doc.status == 'Expired'"
      params:
        - {name: lost_reason, type: link, to: LostReason, label: Lost Reason, required: true}
        - {name: lost_detail, type: text, label: Detail}
  list: {columns: [number, revision, party_name, posting_date, valid_till, grand_total, status], sort: posting_date desc}
