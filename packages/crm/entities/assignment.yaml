- name: LeadAssignmentMember
  label: Assignment Rule Member
  kind: child
  fields:
    - {name: user, type: email, required: true, in_list: true, label: Person, description: "A user's email; inactive users are skipped"}

- name: LeadAssignmentRule
  label: Lead Assignment Rule
  kind: master
  module: crm
  title_field: rule_name
  description: "Gives a lead that arrives by itself (from a form, a mail, an integration), or one entered or imported with no owner where the rule says so, to one of its people. Rules are tried in order; the first that matches and has an active person wins."
  fields:
    - {name: rule_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: enabled, type: check, default: true, in_list: true, in_filter: true}
    - {name: rule_order, type: int, required: true, default: 1, min: 0, label: Order, in_list: true, description: "Lower numbers are tried first"}
    - {name: source, type: select, in_list: true, description: "Empty: any source",
       options: [Website, Referral, Advertisement, Campaign, Cold Call, Email, Social Media, Trade Show, Partner, Existing Customer, Other]}
    - {name: territory, type: link, to: Territory, in_list: true, description: "Empty: any territory; a territory takes the ones under it too"}
    - {name: campaign, type: link, to: Campaign, description: "Empty: any campaign"}
    - {name: company, type: link, to: Company, description: "Empty: any company"}
    - {name: takes, type: select, options: ["Leads that arrive by themselves (forms, mail, integrations)", "Also leads people enter or import without an owner"], required: true, default: "Leads that arrive by themselves (forms, mail, integrations)", label: Takes,
       description: "Whose leads it takes. With the second, a lead a rep enters or imports without an owner goes round too: reps choose themselves as owner to keep a lead they enter"}
    - {name: method, type: select, options: [In Turn, Fewest Open Leads], required: true, default: In Turn, in_list: true, label: Share Out,
       description: "In Turn gives each person the next lead in their turn; Fewest Open Leads gives it to whoever holds the fewest new, contacted or qualified leads"}
    - {name: people, type: table, of: LeadAssignmentMember, label: People}
    - {name: last_assigned_to, type: email, read_only: true, no_copy: true, label: Last Given To, description: "Whose turn it was last"}
  form:
    - {label: Rule, fields: [rule_name, enabled, rule_order, method]}
    - {label: Which Leads, fields: [takes, source, territory, campaign, company]}
    - {label: People, fields: [people, last_assigned_to]}
  list: {columns: [rule_name, rule_order, source, territory, method, enabled], sort: rule_order asc}

- name: CrmSettings
  label: CRM Settings
  kind: settings
  module: crm
  description: "When CRM reminds people of their work (zero switches a reminder off; each person can also switch each kind off in their notification settings), and what a lead's recent activity adds to its score."
  fields:
    - {name: overdue_activity_hours, type: int, default: 1, min: 0, max: 720, label: Overdue Activity After (Hours), description: "Tell an activity's assignee once it is this many hours past due"}
    - {name: untouched_lead_hours, type: int, default: 24, min: 0, max: 8760, label: Untouched New Lead After (Hours), description: "Tell a new lead's owner when nothing has been logged or planned on it this many hours after it arrived"}
    - {name: quiet_deal_days, type: int, default: 14, min: 0, max: 3650, label: Quiet Deal After (Days), description: "Tell an open deal's owner when no activity was logged and its stage did not move for this many days"}
    - {name: no_next_step_days, type: int, default: 1, min: 0, max: 3650, label: Deal Without Next Step After (Days),
       description: "Tell an open deal's owner when it has no open activity, next step or follow-up date, and nothing moved on it for this many days"}
    - {name: activity_points, type: int, default: 10, min: 0, max: 1000, label: Points for a Recent Activity,
       description: "What a done call, meeting or email adds to its lead's score the day it happens; zero leaves activities out of scores"}
    - {name: activity_half_life_days, type: int, default: 14, min: 1, max: 3650, label: Activity Points Halve Every (Days)}
    - {name: quote_link_shows, type: select, options: [Lines and Totals, Totals Only, Neither], default: Lines and Totals, label: Customer's Page Shows,
       description: "What the page a quotation's link opens shows the customer besides the answer: the lines and the totals, the totals only, or neither (the document mailed with it has them all)"}
    - {name: quote_link_code, type: check, default: false, label: Ask a One-Time Code Before an Answer,
       description: "Before the customer answers on their link, a code is sent to the address the quotation went to, and they type it"}
    - {name: order_on_accept, type: check, default: false, label: Order an Accepted Quotation,
       description: "When a customer accepts a quotation (on their link, or a person records it), a draft sales order is made from it, as Create Sales Order makes it; needs ERP and the CRM and ERP connector"}
    - {name: file_communications, type: check, default: true, label: File Mail and Calls to Their People,
       description: "A mail or a call in Mail's communications whose other party is a lead, contact, prospect or customer by exact address or number is shown on their timeline (and on the newest open deal of theirs); a calendar event with such a guest becomes a meeting activity"}
    - {name: unknown_sender_lead, type: check, default: false, label: Make a Lead of an Unknown Sender,
       description: "Mail received from an address CRM does not know (and that is not a person of the workspace or an automatic sender) makes a lead, from the sender's name and address"}
    - {name: forecast_period, type: select, options: [Month, Quarter, Year], default: Month, label: Forecast Period, description: "The period of the snapshots CRM takes of each owner's forecast"}
    - {name: forecast_snapshot_days, type: int, default: 7, min: 0, max: 365, label: Forecast Snapshot Every (Days), description: "Zero takes none"}
  form:
    - {label: Reminders, fields: [overdue_activity_hours, untouched_lead_hours, quiet_deal_days, no_next_step_days]}
    - {label: Lead Scoring, fields: [activity_points, activity_half_life_days]}
    - {label: Quotations, fields: [quote_link_shows, quote_link_code, order_on_accept]}
    - {label: Mail and Calendar, fields: [file_communications, unknown_sender_lead]}
    - {label: Forecast, fields: [forecast_period, forecast_snapshot_days]}
