- name: Lead
  label: Lead
  kind: document
  module: crm
  title_field: lead_name
  mergeable: true
  duplicate_fields: [email, mobile, phone]
  company_scoped: true
  numbering: {template: "LEAD-{YYYY}-{seq:5}"}
  search_fields: [organization_name, email, phone, mobile]
  owner_fields: [assigned_to]
  fields:
    - {name: first_name, type: data}
    - {name: last_name, type: data}
    - {name: lead_name, type: data, read_only: true, label: Name, in_list: true}
    - {name: organization_name, type: data, label: Organization, in_list: true}
    - {name: job_title, type: data}
    - {name: email, type: email, index: true, in_list: true}
    - {name: phone, type: phone}
    - {name: mobile, type: phone}
    - {name: website, type: url}
    - {name: status, type: select, options: [New, Contacted, Qualified, Converted, Lost, Junk], required: true, default: New, in_list: true, in_filter: true}
    - {name: lost_reason, type: link, to: LostReason, visible_if: "doc.status == 'Lost'", required_if: "doc.status == 'Lost'"}
    - {name: assigned_to, type: email, label: Lead Owner, in_list: true, in_filter: true, description: "A user's email; the owner can see and edit the lead. Left empty, it is yours, unless an assignment rule takes leads people enter"}
    - {name: assignment_rule, type: link, to: LeadAssignmentRule, read_only: true, no_copy: true, in_filter: true, label: Assigned By Rule}
    - {name: sales_team, type: link, to: SalesTeam, in_filter: true, description: "Empty: its owner's first team. Its manager sees and works it"}
    - {name: score, type: int, read_only: true, no_copy: true, in_list: true, in_filter: true, description: "From the Lead Scoring Rules it meets and its recent calls, meetings and emails"}
    - {name: score_why, type: text, read_only: true, no_copy: true, label: Why This Score}
    - {name: scored_at, type: datetime, read_only: true, hidden: true, no_copy: true, description: "When its score was last worked out"}
    - {name: next_follow_up, type: date, in_list: true, in_filter: true}
    - {name: last_contacted_on, type: date, read_only: true, no_copy: true}
    - {name: last_touched_at, type: datetime, read_only: true, no_copy: true, in_filter: true, label: Last Touched, description: "When an activity on it was last logged or completed"}
    - {name: untouched_told, type: check, read_only: true, hidden: true, no_copy: true, description: "Its owner was told nobody had touched it yet"}
    - name: source
      type: select
      in_filter: true
      options: [Website, Referral, Advertisement, Campaign, Cold Call, Email, Social Media, Trade Show, Partner, Existing Customer, Other]
    - {name: campaign, type: link, to: Campaign, in_filter: true}
    - {name: prospect, type: link, to: Prospect, in_filter: true}
    - {name: territory, type: link, to: Territory, in_filter: true}
    - name: industry
      type: select
      in_filter: true
      options: [Agriculture, Automotive, Banking and Finance, Construction, Consulting, Education, Energy and Utilities, Government, Healthcare,
                Hospitality, Information Technology, Insurance, Logistics, Manufacturing, Media and Entertainment, Non-Profit, Pharmaceuticals,
                Real Estate, Retail, Services, Telecommunications, Wholesale and Distribution, Other]
    - {name: company_size, type: select, options: ["1-10", "11-50", "51-200", "201-500", "501-1000", "1001+"], label: Employees}
    - {name: annual_revenue, type: currency, min: "0"}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: budget, type: currency, min: "0"}
    - {name: is_decision_maker, type: check, label: Decision Maker}
    - {name: need, type: text, label: Need / Pain Points}
    - {name: timeline, type: select, options: [Immediately, This Quarter, Next Quarter, This Year, Not Sure], label: Purchase Timeline}
    - {name: qualified_on, type: date, read_only: true, no_copy: true}
    - {name: qualified_by, type: data, read_only: true, no_copy: true}
    - {name: address_line1, type: data}
    - {name: address_line2, type: data}
    - {name: city, type: data, in_filter: true}
    - {name: state, type: data}
    - {name: postal_code, type: data}
    - {name: country, type: data}
    - {name: customer, type: link, to: Customer, read_only: true, no_copy: true, in_filter: true}
    - {name: contact, type: link, to: Contact, read_only: true, no_copy: true}
    - {name: converted_on, type: date, read_only: true, no_copy: true}
    - {name: do_not_call, type: check, in_filter: true, label: Do Not Call, description: "No sales calls: a call logged to them needs a reason"}
    - {name: call_consent_on, type: date, label: Calls Since, description: "Since when calls are allowed or refused; set when it changes"}
    - {name: call_consent_how, type: data, description: "A web form, in person, a phone call, a request by mail or letter…", label: Calls Given or Withdrawn By}
    - {name: unsubscribed, type: check, in_filter: true, description: Do not send marketing communication}
    - {name: email_consent_on, type: date, label: Email Since, description: "Since when marketing email is allowed or refused; set when it changes"}
    - {name: email_consent_how, type: data, description: "A web form, in person, a phone call, a request by mail or letter…", label: Email Given or Withdrawn By}
    - {name: email_bounced_on, type: date, read_only: true, no_copy: true, in_filter: true, label: Email Bounced On, description: "The day a mail to this address came back undelivered: sequences send nothing more to it"}
    - {name: allow_duplicate, type: check, no_copy: true, description: "Save it although an open lead has the same email or phone; it is linked to that lead, to merge later"}
    - {name: phone_key, type: data, read_only: true, hidden: true, no_copy: true, index: true, description: "The phone's national part, by which the same person is found"}
    - {name: mobile_key, type: data, read_only: true, hidden: true, no_copy: true, index: true, description: "The mobile's national part, by which the same person is found"}
    - {name: duplicate_of, type: link, to: Lead, read_only: true, no_copy: true, in_filter: true, description: "An earlier lead with the same email or phone, to merge with or keep apart"}
    - {name: conversion, type: json, read_only: true, hidden: true, no_copy: true, description: "What converting it made and changed, so that it can be undone"}
    - {name: record_type, type: link, to: RecordType, in_filter: true, link_filters: {applies_to: Lead}, description: "Its kind: what it fills in when it is made and asks for before a status"}
    - {name: notes, type: text}
  form:
    - {label: Lead, fields: [record_type, first_name, last_name, lead_name, organization_name, job_title, status, lost_reason, assigned_to, sales_team, assignment_rule, score, score_why, next_follow_up, last_contacted_on, last_touched_at]}
    - {label: Contact Details, fields: [email, phone, mobile, website, do_not_call, call_consent_on, call_consent_how, unsubscribed, email_consent_on, email_consent_how, email_bounced_on, allow_duplicate, duplicate_of]}
    - {label: Source and Segment, fields: [source, campaign, prospect, territory, industry, company_size, annual_revenue, company]}
    - {label: Qualification, collapsible: true, fields: [budget, is_decision_maker, need, timeline, qualified_on, qualified_by]}
    - {label: Address, collapsible: true, fields: [address_line1, address_line2, city, state, postal_code, country]}
    - {label: Conversion, collapsible: true, fields: [customer, contact, converted_on]}
    - {label: Notes, collapsible: true, fields: [notes]}
  rules:
    - {name: converted_via_action, check: "(doc.status == 'Converted') == (doc.customer != null)", message: "Use 'Convert to Customer' to convert a lead; a converted lead stays Converted"}
  actions:
    - name: convert_to_customer
      label: Convert to Customer
      permission: write
      condition: "doc.status != 'Converted' && doc.status != 'Lost' && doc.status != 'Junk'"
      confirm: "Create a customer, contact and address from this lead?"
      params:
        - {name: customer, type: link, to: Customer, label: Existing Customer, description: "A new customer is made from the lead when empty"}
        - {name: contact, type: link, to: Contact, label: Existing Contact, description: "The person as a contact already; its customer is taken when none is chosen"}
        - {name: customer_group, type: link, to: CustomerGroup, label: Customer Group, description: "For a new customer"}
        - {name: create_new, type: check, label: Create New Anyway, description: "Make a new customer and contact although one already has the lead's email or phone"}
    - name: undo_conversion
      label: Undo Conversion
      permission: write
      condition: "doc.status == 'Converted'"
      confirm: "Give the lead back its deals, quotations and activities, and remove the customer, contact and address the conversion made?"
    - {name: make_opportunity, label: Create Opportunity, permission: read, condition: "doc.status != 'Lost' && doc.status != 'Junk'"}
    - name: enrol_in_sequence
      label: Enrol in Sequence
      permission: write
      condition: "doc.status == 'New' || doc.status == 'Contacted' || doc.status == 'Qualified'"
      params:
        - {name: sequence, type: link, to: Sequence, required: true, label: Sequence}
    - name: assign_by_rules
      label: Assign by Rules
      permission: write
      condition: "doc.status == 'New' || doc.status == 'Contacted' || doc.status == 'Qualified'"
      confirm: "Give this lead to the person its assignment rules choose?"
  list: {columns: [number, lead_name, organization_name, status, assigned_to, score, next_follow_up], sort: created_at desc}

- name: OpportunityItem
  label: Opportunity Item
  kind: child
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true}
    - {name: item_name, type: data, fetch_from: item.item_name, read_only: true, in_list: true}
    - {name: description, type: text}
    - {name: uom, type: link, to: Uom, in_list: true, label: Unit, description: The item's stock unit unless another of its units is chosen}
    - {name: qty, type: decimal, required: true, default: 1, min: "0.000000001", in_list: true}
    - {name: rate, type: currency, min: "0", currency: parent.currency, in_list: true, description: "The item's price in the deal's price list and currency when the item is chosen; yours to change"}
    - {name: discount_percent, type: percent, min: "0", max: "100", label: Discount %, in_list: true}
    - {name: amount, type: currency, read_only: true, currency: parent.currency, in_list: true, description: After the discount}

- name: OpportunityContact
  label: Opportunity Contact
  kind: child
  fields:
    - {name: contact, type: link, to: Contact, required: true, in_list: true}
    - {name: role, type: link, to: BuyingRole, label: Buying Role, in_list: true}
    - {name: is_primary, type: check, label: Primary, in_list: true, description: "The deal's Contact; one contact is the primary"}

- name: OpportunityCompetitor
  label: Opportunity Competitor
  kind: child
  fields:
    - {name: competitor, type: data, required: true, in_list: true}
    - {name: their_price, type: currency, min: "0", currency: parent.currency, in_list: true}
    - {name: notes, type: data, in_list: true}

- name: Opportunity
  label: Opportunity
  label_plural: Opportunities
  kind: document
  module: crm
  title_field: title
  company_scoped: true
  numbering: {template: "OPP-{YYYY}-{seq:5}"}
  search_fields: [party_name]
  owner_fields: [assigned_to]
  fields:
    - {name: title, type: data, required: true, in_list: true, description: Defaults to the party name}
    - {name: opportunity_from, type: select, options: [Lead, Customer, Prospect], required: true, default: Lead, in_filter: true}
    - {name: lead, type: link, to: Lead, visible_if: "doc.opportunity_from == 'Lead'", required_if: "doc.opportunity_from == 'Lead'", in_filter: true}
    - {name: customer, type: link, to: Customer, required_if: "doc.opportunity_from == 'Customer'", in_filter: true, description: "For a lead or a prospect: set once it becomes a customer"}
    - {name: party_name, type: data, read_only: true, in_list: true}
    - {name: prospect, type: link, to: Prospect, required_if: "doc.opportunity_from == 'Prospect'", in_filter: true}
    - {name: contact, type: link, to: Contact, label: Primary Contact, description: "The primary of its contacts"}
    - {name: contacts, type: table, of: OpportunityContact, description: "The people in the decision, with their buying roles; one is the primary"}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - {name: record_type, type: link, to: RecordType, in_filter: true, link_filters: {applies_to: Opportunity}, description: "Its kind: its pipeline, what it fills in when it is made and what it asks for before a stage"}
    - {name: pipeline, type: link, to: SalesPipeline, in_list: true, in_filter: true, description: "Empty: the sales stage's, else the default pipeline. Another pipeline puts the deal at its first open stage unless a stage of it is chosen"}
    - {name: sales_stage, type: link, to: SalesStage, required: true, in_list: true, in_filter: true, description: Defaults to the first open stage of its pipeline}
    - {name: open_stage, type: link, to: SalesStage, read_only: true, hidden: true, no_copy: true, label: Last Open Stage, description: Where it stood while open; reopening takes it back there}
    - {name: probability, type: percent, min: "0", max: "100", in_list: true, description: Defaults from the sales stage}
    - name: forecast_category
      type: select
      options: [Pipeline, Best Case, Commit, Omitted]
      in_filter: true
      description: "Empty: its stage's. Won deals count as Closed"
    - {name: status, type: select, options: [Open, Won, Lost, Closed], required: true, default: Open, in_list: true, in_filter: true}
    - {name: lost_reason, type: link, to: LostReason, visible_if: "doc.status == 'Lost'", required_if: "doc.status == 'Lost'"}
    - {name: lost_detail, type: text, visible_if: "doc.status == 'Lost'"}
    - {name: expected_close_date, type: date, in_list: true, in_filter: true}
    - {name: currency, type: link, to: Currency, description: Defaults to the company currency}
    - {name: conversion_rate, type: decimal, default: 1, min: "0.000000001", description: Opportunity currency → company currency}
    - {name: price_list, type: link, to: PriceList, description: "Its customer's, else the first selling price list, as a quotation's; the lines' rates come from it"}
    - {name: items, type: table, of: OpportunityItem}
    - {name: amount, type: currency, currency: currency, min: "0", in_list: true, description: "Entered directly, or the total of the items"}
    - {name: weighted_amount, type: currency, currency: currency, read_only: true}
    - {name: base_amount, type: currency, read_only: true, label: Amount (Company Currency)}
    - {name: base_weighted_amount, type: currency, read_only: true, label: Weighted Amount (Company Currency)}
    - {name: competitors, type: table, of: OpportunityCompetitor}
    - {name: assigned_to, type: email, default_expr: "user.email", label: Opportunity Owner, in_list: true, in_filter: true, description: "A user's email; the owner can see and edit the opportunity"}
    - {name: sales_team, type: link, to: SalesTeam, in_filter: true, description: "Empty: its owner's first team. Its manager sees and works it"}
    - {name: next_step, type: data}
    - {name: next_follow_up, type: date, in_filter: true}
    - name: source
      type: select
      in_filter: true
      options: [Website, Referral, Advertisement, Campaign, Cold Call, Email, Social Media, Trade Show, Partner, Existing Customer, Other]
    - {name: campaign, type: link, to: Campaign, in_filter: true}
    - {name: territory, type: link, to: Territory, in_filter: true}
    - {name: closed_on, type: date, read_only: true, no_copy: true}
    - {name: stage_changed_at, type: datetime, read_only: true, no_copy: true, in_filter: true, label: In Stage Since}
    - {name: last_activity_at, type: datetime, read_only: true, no_copy: true, in_filter: true, label: Last Activity, description: "When an activity on it was last logged or completed"}
    - {name: quiet_told, type: check, read_only: true, hidden: true, no_copy: true, description: "Its owner was told nothing had been done on it"}
    - {name: no_step_told, type: check, read_only: true, hidden: true, no_copy: true, description: "Its owner was told it had no next step"}
    - {name: notes, type: text}
  form:
    - {label: Opportunity, fields: [record_type, title, opportunity_from, lead, customer, party_name, prospect, contact, assigned_to, sales_team]}
    - {label: Contacts, fields: [contacts]}
    - {label: Pipeline, fields: [pipeline, sales_stage, probability, forecast_category, status, lost_reason, lost_detail, expected_close_date, next_step, next_follow_up, stage_changed_at, last_activity_at, closed_on]}
    - {label: Value, fields: [currency, conversion_rate, price_list, items, amount, weighted_amount, base_amount, base_weighted_amount]}
    - {label: Competition, collapsible: true, fields: [competitors]}
    - {label: Source, collapsible: true, fields: [source, campaign, territory, company]}
    - {label: Notes, collapsible: true, fields: [notes]}
  actions:
    - {name: make_quotation, label: Create Quotation, permission: read, condition: "doc.status == 'Open'"}
    - {name: mark_won, label: Mark as Won, permission: write, condition: "doc.status == 'Open'"}
    - name: mark_lost
      label: Mark as Lost
      permission: write
      condition: "doc.status == 'Open'"
      params:
        - {name: lost_reason, type: link, to: LostReason, label: Lost Reason, required: true}
        - {name: lost_detail, type: text, label: Detail}
    - name: reopen
      label: Reopen
      permission: write
      condition: "doc.status != 'Open'"
      confirm: "Open this deal again, at the stage it last held?"
  list: {columns: [number, title, party_name, sales_stage, amount, expected_close_date, status], sort: expected_close_date asc}

- name: Activity
  label: Activity
  label_plural: Activities
  kind: document
  module: crm
  title_field: subject
  owner_fields: [assigned_to]
  fields:
    - {name: activity_type, type: select, options: [Call, Meeting, Email, Task, Note], required: true, default: Task, in_list: true, in_filter: true}
    - {name: subject, type: data, required: true, in_list: true}
    - {name: status, type: select, options: [Open, Done, Cancelled], required: true, default: Open, in_list: true, in_filter: true, description: Notes are always Done}
    - {name: due_at, type: datetime, label: Due / At, in_list: true, in_filter: true}
    - {name: assigned_to, type: email, default_expr: "user.email", in_list: true, in_filter: true, description: "A user's email; the assignee can see and edit the activity"}
    - {name: sales_team, type: link, to: SalesTeam, in_filter: true, description: "Empty: its owner's first team. Its manager sees and works it"}
    - {name: lead, type: link, to: Lead, in_filter: true}
    - {name: opportunity, type: link, to: Opportunity, in_filter: true}
    - {name: customer, type: link, to: Customer, in_filter: true}
    - {name: contact, type: link, to: Contact, in_filter: true}
    - {name: call_outcome, type: select, options: [Reached, No Answer, Left Message, Busy, Wrong Number], label: Outcome, visible_if: "doc.activity_type == 'Call'", in_filter: true}
    - {name: duration_minutes, type: int, min: 0, label: Duration (Minutes), visible_if: "doc.activity_type == 'Call' || doc.activity_type == 'Meeting'"}
    - {name: call_reason, type: text, label: Reason for Calling, visible_if: "doc.activity_type == 'Call'", description: "Needed for a call to someone on do-not-call"}
    - {name: details, type: text}
    - {name: completed_at, type: datetime, read_only: true, no_copy: true}
    - {name: overdue_told, type: check, read_only: true, hidden: true, no_copy: true, description: "Its assignee was told it is overdue"}
    - {name: calendar_event, type: data, read_only: true, hidden: true, no_copy: true, index: true, description: "The calendar event a meeting was made from: it follows the event when it moves or is cancelled"}
  actions:
    - name: complete
      label: Mark as Done
      permission: write
      condition: "doc.status == 'Open'"
      params:
        - {name: call_outcome, type: select, label: Outcome, options: [Reached, No Answer, Left Message, Busy, Wrong Number]}
        - {name: duration_minutes, type: int, label: Duration (Minutes)}
        - {name: call_reason, type: text, label: Reason for Calling, description: "Needed for a call to someone on do-not-call"}
        - {name: next_follow_up, type: date, label: Next Follow Up, description: "On its deal, else its lead"}
  list: {columns: [subject, activity_type, status, due_at, assigned_to], sort: due_at asc}
