- name: SalesPipeline
  label: Pipeline
  label_plural: Pipelines
  kind: master
  module: crm
  title_field: pipeline_name
  description: "A sales process with its own stages, such as New Business or Renewals. A deal is in one pipeline; one pipeline is the default."
  fields:
    - {name: pipeline_name, type: data, required: true, unique: true, label: Name, in_list: true}
    - {name: is_default, type: check, label: Default, in_list: true, description: "Where a deal goes when no pipeline is chosen; making one the default makes it the only one"}
    - {name: disabled, type: check, in_list: true, in_filter: true, description: "No deal can be put in it; refused while open deals stand in it"}
    - {name: description, type: text}
  list: {columns: [pipeline_name, is_default, disabled], sort: pipeline_name asc}

- name: SalesStage
  label: Sales Stage
  kind: master
  module: crm
  title_field: stage_name
  description: Steps of a pipeline with the win probability its deals default to, and what a deal must have before it enters one.
  fields:
    - {name: pipeline, type: link, to: SalesPipeline, required: true, in_list: true, in_filter: true, description: "The pipeline it is a step of; empty, the default one"}
    - {name: stage_name, type: data, required: true, in_list: true, description: "Unique within its pipeline"}
    - {name: probability, type: percent, required: true, default: 0, min: "0", max: "100", in_list: true, description: Default win probability of opportunities in this stage}
    - {name: stage_order, type: int, required: true, default: 0, label: Order, in_list: true}
    - {name: outcome, type: select, options: [Open, Won, Lost], required: true, default: Open, in_list: true, in_filter: true, description: Won and Lost stages close the opportunity}
    - name: forecast_category
      type: select
      options: [Pipeline, Best Case, Commit, Omitted]
      default: Pipeline
      visible_if: "doc.outcome == 'Open'"
      description: "Where its open deals count in the forecast unless a deal says otherwise (empty: Pipeline); won deals count as Closed"
    - {name: requires_amount, type: check, label: An Amount, visible_if: "doc.outcome != 'Lost'",
       description: "What a deal moved forward into this stage must have; moving it back or losing it is never held up"}
    - {name: requires_close_date, type: check, label: An Expected Close Date, visible_if: "doc.outcome != 'Lost'"}
    - {name: requires_primary_contact, type: check, label: A Primary Contact, visible_if: "doc.outcome != 'Lost'"}
    - {name: requires_next_step, type: check, label: A Next Step, visible_if: "doc.outcome != 'Lost'"}
    - {name: requires_lines, type: check, label: At Least One Line, visible_if: "doc.outcome != 'Lost'"}
    - {name: requires_quotation, type: check, label: A Submitted Quotation, visible_if: "doc.outcome != 'Lost'"}
    - {name: disabled, type: check, in_filter: true, description: "Refused while open deals stand in it"}
  unique: [[pipeline, stage_name]]
  form:
    - {label: Stage, fields: [pipeline, stage_name, probability, stage_order, outcome, forecast_category, disabled]}
    - {label: Before a Deal Enters It, visible_if: "doc.outcome != 'Lost'", fields: [requires_amount, requires_close_date, requires_primary_contact, requires_next_step, requires_lines, requires_quotation]}
  list: {columns: [stage_name, pipeline, probability, stage_order, outcome], sort: stage_order asc}

- name: BuyingRole
  label: Buying Role
  kind: master
  module: crm
  title_field: role_name
  description: "What a person does in a deal's decision: decides, influences, uses it, pays or signs."
  fields:
    - {name: role_name, type: data, required: true, unique: true, label: Role, in_list: true}
    - {name: description, type: text}
  list: {sort: role_name asc}

- name: LostReason
  label: Lost Reason
  kind: master
  module: crm
  title_field: reason
  fields:
    - {name: reason, type: data, required: true, unique: true, in_list: true}
    - {name: description, type: text}
  list: {sort: reason asc}

- name: TerritoryMember
  label: Territory Member
  kind: child
  fields:
    - {name: person, type: email, required: true, in_list: true, description: "A user's email"}

- name: Territory
  label: Territory
  label_plural: Territories
  kind: master
  module: crm
  title_field: territory_name
  description: "A region or market. Its sales people see and work the leads and deals in it and in the territories under it, besides their own."
  fields:
    - {name: territory_name, type: data, required: true, unique: true, in_list: true}
    - {name: parent_territory, type: link, to: Territory, link_filters: {is_group: true}, in_list: true}
    - {name: is_group, type: check, in_list: true}
    - {name: people, type: table, of: TerritoryMember, label: Sales People, description: "Who sees and works the leads and deals in this territory and those under it"}
    - {name: reach, type: table, of: TerritoryMember, read_only: true, hidden: true, no_copy: true, label: Reached By,
       description: "Its sales people and those of the territories above it: whom its leads and deals are open to"}
  list: {sort: territory_name asc}

- name: Campaign
  label: Campaign
  kind: master
  module: crm
  title_field: campaign_name
  company_scoped: true
  description: Marketing campaigns; amounts are in the company currency.
  fields:
    - {name: campaign_name, type: data, required: true, in_list: true}
    - {name: company, type: link, to: Company, required: true, default_expr: "user.default_company", in_filter: true}
    - name: campaign_type
      type: select
      in_list: true
      in_filter: true
      options: [Email, Social Media, Webinar, Event, Trade Show, Advertising, Content, Referral Program, Direct Mail, Telemarketing, Other]
    - {name: status, type: select, options: [Planned, Active, Completed, Cancelled], required: true, default: Planned, in_list: true, in_filter: true}
    - {name: start_date, type: date, in_list: true}
    - {name: end_date, type: date}
    - {name: budget, type: currency, min: "0"}
    - {name: actual_cost, type: currency, min: "0"}
    - {name: expected_revenue, type: currency, min: "0"}
    - {name: description, type: text}
  unique: [[company, campaign_name]]
  rules:
    - {name: dates, check: "doc.end_date == null || doc.start_date == null || doc.end_date >= doc.start_date", message: "The end date is before the start date"}
  list: {columns: [campaign_name, campaign_type, status, start_date], sort: start_date desc}

- name: Prospect
  label: Prospect
  kind: master
  module: crm
  title_field: prospect_name
  description: An organization being pursued through one or more leads and opportunities.
  mergeable: true
  duplicate_fields: [email, phone, prospect_name]
  search_fields: [email, phone]
  fields:
    - {name: prospect_name, type: data, required: true, unique: true, label: Organization, in_list: true}
    - name: industry
      type: select
      in_list: true
      in_filter: true
      options: [Agriculture, Automotive, Banking and Finance, Construction, Consulting, Education, Energy and Utilities, Government, Healthcare,
                Hospitality, Information Technology, Insurance, Logistics, Manufacturing, Media and Entertainment, Non-Profit, Pharmaceuticals,
                Real Estate, Retail, Services, Telecommunications, Wholesale and Distribution, Other]
    - {name: company_size, type: select, options: ["1-10", "11-50", "51-200", "201-500", "501-1000", "1001+"], label: Employees}
    - {name: annual_revenue, type: currency, min: "0"}
    - {name: territory, type: link, to: Territory, in_filter: true}
    - {name: website, type: url}
    - {name: email, type: email}
    - {name: phone, type: phone}
    - {name: assigned_to, type: email, default_expr: "user.email", label: Account Owner, in_list: true, in_filter: true}
    - {name: parent_prospect, type: link, to: Prospect, label: Parent Account, in_filter: true, description: "The group or head office it belongs to"}
    - {name: customer, type: link, to: Customer, read_only: true, no_copy: true, in_filter: true, description: Set when one of its leads is converted}
    - {name: notes, type: text}
  list: {columns: [prospect_name, industry, territory, assigned_to], sort: prospect_name asc}

- name: ProductRule
  label: Product Rule
  label_plural: Product Rules
  kind: master
  module: crm
  title_field: description
  description: "What may be quoted together: an item that needs another on the same quotation, two that exclude each other, or one that needs so many of another per unit. A quotation that breaks one lists it, and is not submitted until it is put right."
  fields:
    - {name: item, type: link, to: Item, required: true, in_list: true, in_filter: true}
    - {name: rule, type: select, options: [Requires, Excludes, At least per unit], required: true, default: Requires, in_list: true}
    - {name: other_item, type: link, to: Item, required: true, in_list: true}
    - {name: qty_per_unit, type: decimal, min: "0.000000001", visible_if: "doc.rule == 'At least per unit'", required_if: "doc.rule == 'At least per unit'", label: Qty of the Other per Unit, description: In stock units}
    - {name: description, type: data, required: true, in_list: true, description: "What people read when the rule is broken, e.g. The boiler is installed with its kit"}
    - {name: disabled, type: check, in_filter: true}
  rules:
    - {name: another_item, check: "doc.item != doc.other_item", message: "A rule is between two different items"}
  list: {columns: [item, rule, other_item, description, disabled], sort: item asc}

- name: QuotationApprovalRule
  label: Quotation Approval Rule
  kind: master
  module: crm
  title_field: rule_name
  description: "A quotation past these limits needs someone else's approval before it can be submitted."
  fields:
    - {name: rule_name, type: data, label: Name, required: true, unique: true, in_list: true}
    - {name: enabled, type: check, default: true, in_list: true}
    - {name: discount_over, type: percent, min: "0", max: "100", in_list: true, description: "Additional discount above this needs approval"}
    - {name: total_over, type: currency, min: "0", in_list: true, description: "A grand total above this, in the company's currency, needs approval"}
    - {name: approver_role, type: data, required: true, default: Sales Manager, in_list: true}
  rules:
    - {name: a_limit, check: "doc.discount_over != null || doc.total_over != null", message: "Give a discount or a total for it to watch"}
  list: {columns: [rule_name, discount_over, total_over, approver_role, enabled], sort: rule_name asc}
