id: crm
name: CRM
version: 0.13.6
publisher: cbferrum
summary: Leads, opportunities and pipeline, contacts, campaigns, activities and quotations
description: README.md
categories: [crm, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-crm
support: https://github.com/CBFerrum/ferrum-app-crm/issues
runtime: native
platform: ">=0.3.4, <0.4"
packages: [crm]
uninstall: ask
# Its own interface at /crm/ (Ferrum docs/plan/apps-ui.md §13, U4b): the pipeline, and its records
# in lists and forms (ui/, built into ui/dist).
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: crm
      route: crm
      title: CRM
      description: Leads, deals, contacts and quotations
      icon: contact
      color: "#0f766e"
      roles: [Sales User, Sales Manager]
  shell.open:
    # Its own records, and the contacts it keeps (customers and items open where the workspace's
    # other apps show them, ERP's or this one's, by install order).
    - {id: deal, entity: Opportunity, path: "crm/d/{id}", list: crm/, priority: 1}
    - {id: crm, package: crm, path: "crm/e/{entity}/{id}", list: "crm/e/{entity}"}
    - {id: contacts, package: contacts, path: "crm/e/{entity}/{id}", list: "crm/e/{entity}", priority: 1}
    - {id: parties, package: parties, path: "crm/e/{entity}/{id}", list: "crm/e/{entity}"}
  shell.create:
    - {id: lead, label: Lead, path: crm/e/Lead/new, entity: Lead}
    - {id: deal, label: Deal, path: crm/e/Opportunity/new, entity: Opportunity}
    - {id: contact, label: Contact, path: crm/e/Contact/new, entity: Contact}
    - {id: quotation, label: Quotation, path: crm/e/Quotation/new, entity: Quotation}
    - {id: activity, label: Activity, path: crm/e/Activity/new, entity: Activity}
  # Home's My work: the person's activities due or overdue, and leads and deals to follow up.
  shell.work:
    - {id: work, title: Sales follow-ups, endpoint: /api/app/crm/work}
  # The kinds of notification CRM sends ({app}.{id}, as src/ sends them, with these defaults); each
  # person chooses how each reaches them, or switches it off. When reminders come is CRM Settings'.
  shell.notification:
    - {id: assigned, label: Leads given to you, default: [inapp, email]}
    - {id: activity_overdue, label: Your activities that are overdue, default: [inapp]}
    - {id: lead_untouched, label: Your new leads nobody has touched, default: [inapp]}
    - {id: deal_quiet, label: Your deals with nothing done lately, default: [inapp]}
    - {id: deal_no_step, label: Your deals with no next step, default: [inapp]}
  # What the assistant should know in CRM's pages, and what it suggests asking there.
  shell.assistant:
    - id: crm
      title: "CRM"
      instructions: >-
        A Lead is New, Contacted, Qualified, Converted, Lost or Junk; converted, it becomes a customer (Undo
        Conversion gives it back), and a lead with an open lead's email or phone is refused unless Allow Duplicate
        is ticked (it is then linked as Duplicate Of). A lead arriving by itself (a form, a mail, an integration) is given an owner by the first
        Lead Assignment Rule that takes it (Assigned By Rule says which); one a person enters or imports without an owner is
        theirs unless a rule also takes those; Last Touched is when an activity on it was last logged or completed. A deal or quotation is for a Lead, a Prospect or a Customer. An Opportunity is Open until Won, Lost or Closed (Reopen opens it again); it is in one SalesPipeline (one is the default), and its stage (a SalesStage of that pipeline) and amount make the
        pipeline, in the opportunity's currency; a stage may require things before a deal enters it. A deal's Forecast Category (Pipeline, Best Case, Commit, Omitted) is its stage's unless set; won deals count as Closed. A deal has contacts with buying roles, one the primary (its Contact). A Quotation counts once submitted, is Sent (Send to Customer: a link to read, accept, decline or ask), Viewed, Accepted or Rejected by the customer, is revised by cancelling and amending (Revision, Revises, Replaced By), and becomes an ERP Sales Order when
        ordered. A deal's In Stage Since and Last Activity say how long it stood and when something was last done. An Activity (Open, Done, Cancelled) is a call, meeting or task with its due time; a call keeps its Outcome and Duration.
        A Customer has an Account Owner, Territory and Parent Account; a contact can be at several (Contacts at Accounts, one primary). A Sales Team's manager and a Territory's Sales People see their people's records. Sales Targets (report: achieved, gap). A call to someone on Do Not Call needs a Reason for Calling. A lead's Score comes from Lead Scoring Rules.
      suggestions:
        - "What does the pipeline look like by stage?"
        - "Which opportunities close this month?"
        - "Which leads have not been contacted yet?"
        - "Which activities are overdue?"
        - "Who is behind their target this quarter?"
        - "Which open leads score highest?"

