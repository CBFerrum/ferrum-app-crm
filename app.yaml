id: crm
name: CRM
version: 0.4.0
publisher: cbferrum
summary: Leads, opportunities and pipeline, contacts, campaigns, activities and quotations
description: README.md
categories: [crm, sales]
license: AGPL-3.0-only
homepage: https://github.com/CBFerrum/ferrum-app-crm
support: https://github.com/CBFerrum/ferrum-app-crm/issues
runtime: native
platform: ">=0.3.2, <0.4"
packages: [crm]
uninstall: ask
# Its own interface at /crm/ (Ferrum docs/plan/apps-ui.md §13, U4b): the pipeline, and its records
# in lists and forms (ui/, built into ui/dist).
ui:
  dist: ui/dist
contributes:
  shell.app:
    - id: crm
      route: crm
      title: CRM
      description: Leads, deals, contacts and quotations
      icon: contact
      color: "#0f766e"
      roles: [Sales User, Sales Manager]
  shell.open:
    # Its own records, and the contacts it keeps (customers and items open where the workspace's
    # other apps show them, ERP's or this one's, by install order).
    - {id: deal, entity: Opportunity, path: "crm/d/{id}", list: crm/, priority: 1}
    - {id: crm, package: crm, path: "crm/e/{entity}/{id}", list: "crm/e/{entity}"}
    - {id: contacts, package: contacts, path: "crm/e/{entity}/{id}", list: "crm/e/{entity}", priority: 1}
    - {id: parties, package: parties, path: "crm/e/{entity}/{id}", list: "crm/e/{entity}"}
  shell.create:
    - {id: lead, label: Lead, path: crm/e/Lead/new, entity: Lead}
    - {id: deal, label: Deal, path: crm/e/Opportunity/new, entity: Opportunity}

